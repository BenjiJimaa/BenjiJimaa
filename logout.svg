<svg xmlns="http://www.w3.org/2000/svg" width="1075px" height="210px" viewBox="0 0 1075 210" font-family="ConsolasFallback,Consolas,'DejaVu Sans Mono',monospace">
<style>@font-face { src: local('Consolas'); font-family: 'ConsolasFallback'; -webkit-size-adjust: 109%; size-adjust: 109%; } text, tspan { white-space: pre; }
.crt { transform-origin: 537.5px 105.0px; animation: crt 12.0s linear infinite; }
@keyframes crt {
  0% { transform: scale(0, .004); opacity: 0 }
  0.67% { transform: scale(.02, .004); opacity: 1 }
  2.50% { transform: scale(1, .004); opacity: 1 }
  4.58% { transform: scale(1, 1); filter: brightness(1.8) }
  6.67% { transform: scale(1, 1); filter: brightness(1) }
  92.50% { transform: scale(1, 1); opacity: 1; filter: brightness(1) }
  94.00% { transform: scale(1, .006); filter: brightness(2.2) }
  96.00% { transform: scale(.012, .006); opacity: 1 }
  97.67% { transform: scale(.012, .006); opacity: 0 }
  100% { transform: scale(0, .004); opacity: 0 }
}
.bl { animation: bl .6s steps(1,end) infinite; } @keyframes bl { 50% { fill-opacity:0 } }</style>
<defs><clipPath id="lc"><rect x="139.2" y="28" height="19" width="0"><animate attributeName="width" calcMode="discrete" values="0;8.8;16.6;24.4;32.2;40.0;47.8" keyTimes="0.0000;0.0833;0.0908;0.0983;0.1058;0.1133;0.1208" dur="12.0s" repeatCount="indefinite"/></rect></clipPath><pattern id="lsl" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".03"/></pattern></defs>
<rect width="1075" height="210" rx="15" fill="#020203"/>
<g class="crt"><rect width="1075" height="210" rx="15" fill="#050406"/><text x="30" y="42" font-size="13"><tspan fill="#9dff4a">benji@void</tspan><tspan fill="#7a7090">:</tspan><tspan fill="#3ee6ff">~</tspan><tspan fill="#7a7090">$ </tspan></text><g clip-path="url(#lc)"><text x="139.2" y="42" font-size="13" fill="#ece8ee" textLength="46.8" lengthAdjust="spacing">logout</text></g><rect y="31" width="7" height="14" fill="#ece8ee" class="bl"><animate attributeName="x" calcMode="discrete" values="139.2;147.0;154.8;162.6;170.4;178.2;186.0" keyTimes="0.0000;0.0833;0.0908;0.0983;0.1058;0.1133;0.1208" dur="12.0s" repeatCount="indefinite"/><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.0000;0.1575" dur="12.0s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1742;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="30" y="64" font-size="12" fill="#7a7090">saving session ........ </text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2033;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="203" y="64" font-size="12" fill="#9dff4a">done</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2200;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="30" y="82" font-size="12" fill="#7a7090">wiping traces ......... </text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2492;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="203" y="82" font-size="12" fill="#9dff4a">done</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2658;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="30" y="100" font-size="12" fill="#7a7090">closing tunnels ....... </text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.2950;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="203" y="100" font-size="12" fill="#9dff4a">3/3</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.3117;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="30" y="126" font-size="13" fill="#ece8ee" font-weight="700">session terminated.</text><text x="198" y="126" font-size="13" fill="#4a4260">you were never here.</text></g><line x1="612" y1="26" x2="612" y2="184" stroke="#1c1822"/><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0000;0.1908;0.9250" dur="12.0s" repeatCount="indefinite"/><text x="640" y="44" font-size="11" fill="#4a4260">// if you still want to reach the suspect</text><text x="640" y="74" font-size="13" fill="#7a7090">instagram  <tspan fill="#ff2fae">@444xbnji</tspan></text><text x="640" y="96" font-size="13" fill="#7a7090">github     <tspan fill="#3ee6ff">github.com/BenjiJimaa</tspan></text><text x="640" y="126" font-size="11" fill="#4a4260">messages are read. replies are not guaranteed.</text></g><text x="1045" y="188" font-size="10" text-anchor="end" fill="#2e2836">EOF</text></g>
