name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 07:00 WIB
  workflow_dispatch:      # bisa dijalankan manual
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23000000&color_dots=%23ebedf0,%23c6c6c6,%238c8c8c,%234d4d4d,%231a1a1a
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%233a3a3a,%236e6e6e,%23a8a8a8,%23ffffff

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
